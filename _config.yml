# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ZJACKIE's BLOG
subtitle: '深耕信息技术与软硬件，记录实战踩坑经历、沉淀实用避坑方案'
description: '这里是 Jackie 的博客，聚焦信息技术、软硬件、开源、物联网、开发板方向。日常输出各类软硬件实测评测、工具使用教程，整理亲身实操遇到的各类踩坑案例，复盘问题成因并给出可行解决办法。全程以第一视角记录真实操作流程，沉淀可复用的实战经验，全部为实测所得，帮助技术爱好者少走弯路，切实提升实操效率。'
keywords: 'Jackie的博客,软硬件测评,开源,物联网,开发板,信息技术,运维技巧,工具教程,实操踩坑,技术实战'
author: Jackie
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.zjackie.ink
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
marked:									#此项为手动添加
  prependRoot: true
  postAsset: true
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo:
      github: git@github.com:pyxmr2025/blog.git
  branch: main

prism_plugin:
  mode: 'preprocess'    
  theme: 'tomorrow'  
  line_number: false   
  custom_css:

permalink_pinyin:
  enable: true
  separator: '-' # default: '-'

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:

tag_generator:
  per_page: 10
  enable_index_page: true
  enable_tagcloud: true

symbols_count_time:
  symbols: true                
  time: true                  
  total_symbols: true         
  total_time: true            
  exclude_codeblock: false     

search:
  path: search.xml
  field: post
  content: true
  format: html

article_recommender:
  inject: true
  strategy: balanced
  default_count: 3
  recommended_title: "推荐文章"
  recency_decay: 0.3
